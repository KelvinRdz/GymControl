<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Membresía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">GymControl</a>
    </div>
</nav>

<div class="container mt-4">

    <h1 class="h4">Formulario de membresía</h1>

    <form th:action="@{/membresias/guardar}"
          th:object="${membresia}"
          method="post"
          class="mt-3">

        <input type="hidden" th:field="*{id}">

        <!-- CLIENTE -->
        <div class="mb-3">

            <label class="form-label">
                Cliente
            </label>

            <select th:field="*{cliente}"
                    class="form-select">

                <option value="">
                    Seleccione un cliente
                </option>

                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.nombre}">
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('cliente')}"
                 th:errors="*{cliente}">
            </div>

        </div>

        <!-- TIPO -->
        <div class="mb-3">

            <label class="form-label">
                Tipo
            </label>

            <input type="text"
                   th:field="*{tipo}"
                   class="form-control">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('tipo')}"
                 th:errors="*{tipo}">
            </div>

        </div>

        <!-- FECHA INICIO -->
        <div class="mb-3">

            <label class="form-label">
                Fecha de inicio
            </label>

            <input type="date"
                   th:field="*{fechaInicio}"
                   class="form-control">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('fechaInicio')}"
                 th:errors="*{fechaInicio}">
            </div>

        </div>

        <!-- FECHA FIN -->
        <div class="mb-3">

            <label class="form-label">
                Fecha de fin
            </label>

            <input type="date"
                   th:field="*{fechaFin}"
                   class="form-control">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('fechaFin')}"
                 th:errors="*{fechaFin}">
            </div>

        </div>

        <!-- ESTADO -->
        <div class="mb-3">

            <label class="form-label">
                Estado
            </label>

            <select th:field="*{estado}"
                    class="form-select">

                <option value="">
                    Seleccione un estado
                </option>

                <option value="ACTIVA">
                    Activa
                </option>

                <option value="INACTIVA">
                    Inactiva
                </option>

                <option value="VENCIDA">
                    Vencida
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('estado')}"
                 th:errors="*{estado}">
            </div>

        </div>

        <button type="submit"
                class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/membresias}"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
